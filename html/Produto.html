<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produto — Essência Body Care</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="header-inner">
        <a class="brand" href="../index.html"
          ><span class="brand-mark" aria-hidden="true"></span
          ><span class="brand-text"
            ><strong>Essência</strong><span>Body Care</span></span
          ></a
        >
        <nav class="nav">
          <a href="../index.html">Início</a
          ><a href="Hidratantes.html">Hidratantes</a
          ><a href="Sabonetes.html">Sabonetes</a><a href="Kits.html">Kits</a
          ><a href="Oleos.html">Óleos</a
          ><a href="DadosPagamento.html">Pagamento</a>
        </nav>
          <div class="header-actions">

           <a href="Usuario.html" class="account-link" aria-label="Minha Conta">
              <span>♙</span>
              Minha Conta
            </a>

            <!-- Carrinho -->
            <button class="icon-btn" type="button"
              data-open-cart aria-label="Abrir carrinho">
              🛒
              <span class="cart-count" data-cart-count>0</span>
            </button>

          </div>
      </div>
    </header>

    <main><div class="product-detail" data-product-detail></div></main>

    <div class="overlay" data-overlay></div>
    <aside class="cart-drawer" data-cart-drawer aria-label="Carrinho">
      <div class="cart-head">
        <h2>Seu carrinho</h2>
        <button
          class="icon-btn"
          data-close-cart
          type="button"
          aria-label="Fechar carrinho"
        >
          ×
        </button>
      </div>
      <div class="cart-list" data-cart-list></div>
      <div class="cart-foot">
        <div class="order-total">
          <span>Total</span><span data-cart-total>R$ 0,00</span>
        </div>
        <a href="DadosPagamento.html" class="btn full" style="margin-top: 12px"
          >Ir para pagamento</a
        >
      </div>
    </aside>
    <div class="toast" data-toast role="status" aria-live="polite"></div>
    <footer>
      <div class="footer-inner">
        <span class="footer-brand">Essência Body Care</span
        ><span>© 2026 · cuidado que começa em você.</span>
      </div>
    </footer>
    <script src="../js/common.js"></script>
  </body>
</html>
